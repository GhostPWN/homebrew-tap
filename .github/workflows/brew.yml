name: brew

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Tap from the checkout so pull requests test their own commit rather
      # than whatever is already on main. The published job covers the command
      # users actually run.
      - name: Tap from this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/ghostpwn/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap

      - name: Audit
        run: brew audit --strict ghostpwn/tap/ghostpwn

      - name: Install
        run: brew install ghostpwn/tap/ghostpwn

      - name: Verify installed version matches the formula
        run: |
          expected="$(brew info --json=v2 ghostpwn/tap/ghostpwn | jq -r '.formulae[0].versions.stable')"
          actual="$(ghostpwn --version)"
          echo "formula: $expected"
          echo "binary:  $actual"
          test "$actual" = "ghostpwn $expected"

      - name: Test
        run: brew test ghostpwn/tap/ghostpwn

  published:
    # The command the README tells users to run, against the live tap.
    if: github.ref == 'refs/heads/main'
    needs: formula
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: brew install GhostPWN/tap/ghostpwn
        run: brew install GhostPWN/tap/ghostpwn

      - name: Verify installed version matches the formula
        run: |
          expected="$(brew info --json=v2 GhostPWN/tap/ghostpwn | jq -r '.formulae[0].versions.stable')"
          actual="$(ghostpwn --version)"
          echo "formula: $expected"
          echo "binary:  $actual"
          test "$actual" = "ghostpwn $expected"
